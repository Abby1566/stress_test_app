name: Manual_Payload_Package
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Runner App
        run: |
          flutter create --platforms ios .
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          # 編譯成 debug 模式，這不需要任何證書也能生成完整資料夾
          flutter build ios --debug --no-codesign

      - name: Collect Payload
        run: |
          mkdir -p Payload
          # 找到編譯出來的 Runner.app 並放入 Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || cp -r build/ios/iphonesimulator/Runner.app Payload/
          
      - name: Upload Folder
        uses: actions/upload-artifact@v4
        with:
          name: Payload_Folder
          path: Payload/
