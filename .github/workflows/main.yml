name: Manual_Payload_Package
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build Simulator App (No Signing Required)
        run: |
          # 1. 建立 iOS 專案基礎
          flutter create --platforms ios .
          flutter pub get
          
          # 2. 處理 iOS 依賴庫
          cd ios
          pod install --repo-update
          cd ..
          
          # 3. 關鍵編譯指令：使用模擬器架構避開簽名報錯
          flutter build ios --debug --simulator --no-codesign

      - name: Prepare Payload Folder
        run: |
          # 建立一個名為 Payload 的資料夾，這是 IPA 的標準格式要求
          mkdir -p Payload
          # 將編譯出的 Runner.app 複製進去
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          
      - name: Upload Runner App
        uses: actions/upload-artifact@v4
        with:
          name: Runner_App_Folder
          # 上傳整個 Payload 資料夾
          path: Payload/
