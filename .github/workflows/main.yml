name: Ultimate_iOS_Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Force Build And Pack
        run: |
          # 1. 建立 iOS 基礎
          flutter create --platforms ios .
          
          # 2. 注入權限 (那個咚咚)
          find ios/Runner -name "Info.plist" -exec sed -i '' '/<dict>/a \
          <key>NSBrightnessUsageDescription</key><string>壓力測試需要</string>\
          <key>UIFileSharingEnabled</key><true/>\
          <key>LSSupportsOpeningDocumentsInPlace</key><true/>' {} +
          
          # 3. 獲取套件
          flutter pub get
          cd ios && pod install --repo-update && cd ..

          # 4. 強制編譯 (無視簽名報錯)
          flutter build ios --debug --no-codesign || true

          # 5. 強力搜刮檔案並打包成 IPA
          mkdir -p Payload
          # 無論檔案在哪個資料夾，通通抓出來
          find build/ios -name "Runner.app" -exec cp -r {} Payload/ \;
          zip -r New_Stress_App.ipa Payload
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ios-final-ipa
          path: New_Stress_App.ipa
