name: Duck_Stress_Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Configure App Name
        run: |
          flutter create --platforms ios .
          plutil -replace CFBundleDisplayName -string "鴨力測試" ios/Runner/Info.plist
          plutil -replace CFBundleName -string "鴨力測試" ios/Runner/Info.plist
          
      - name: Build
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ios --release --no-codesign

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r DuckStress.ipa Payload/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DuckStress_IPA
          path: DuckStress.ipa
