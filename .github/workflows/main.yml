name: Manual_Payload_Package
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Build iOS App for Device (No Signing)
        run: |
          flutter create --platforms ios .
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          
          # 關鍵：編譯為實體機版本，但禁止 Xcode 進行簽名校驗
          flutter build ios --release --no-codesign --build-number=1 --build-name=1.0.0

      - name: Prepare Payload Folder
        run: |
          mkdir -p Payload
          # 這次路徑會是在 iphoneos 資料夾下
          cp -r build/ios/iphoneos/Runner.app Payload/
          
      - name: Upload Runner App
          uses: actions/upload-artifact@v4
        with:
          name: Runner_App_Folder
          path: Payload/
